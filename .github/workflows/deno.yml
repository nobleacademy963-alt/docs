# <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noble Academy - Jijiga, Ethiopia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- 1. TOP HEADER / BAR -->
  <div class="bg-[#002B49] text-white text-xs py-2 px-6 flex justify-between items-center">
    <div class="flex items-center space-x-6">
      <span><i class="fas fa-phone mr-2"></i> 0905100279</span>
      <span><i class="fas fa-envelope mr-2"></i> nobleacademyjijiga@gmail.com</span>
    </div>
    <div class="flex space-x-4">
      <a href="#" class="hover:text-yellow-400"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="hover:text-yellow-400"><i class="fab fa-twitter"></i></a>
      <a href="#" class="hover:text-yellow-400"><i class="fab fa-instagram"></i></a>
    </div>
  </div>

  <!-- 2. NAVIGATION BAR -->
  <nav class="bg-white shadow-sm py-3 px-6 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <!-- Logo Placeholders -->
      <div class="w-12 h-12 bg-[#002B49] rounded-full flex items-center justify-center text-yellow-500 font-bold text-lg border-2 border-yellow-500">
        NA
      </div>
      <div>
        <h1 class="font-bold text-xl text-[#002B49] leading-none uppercase tracking-wide">NOBLE ACADEMY</h1>
        <p class="text-xs text-gray-500 tracking-widest">JIJIGA, ETHIOPIA</p>
      </div>
    </div>

    <!-- Nav Links -->
    <div class="hidden md:flex space-x-8 text-xs font-semibold uppercase tracking-wider text-gray-700">
      <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-1">Home</a>
      <a href="#" class="hover:text-blue-600">About Us</a>
      <a href="#" class="hover:text-blue-600">Academics</a>
      <a href="#" class="hover:text-blue-600">Admissions</a>
      <a href="#" class="hover:text-blue-600">Student Portal</a>
      <a href="#" class="hover:text-blue-600">Contact Us</a>
    </div>

    <!-- Apply Button -->
    <a href="#" class="bg-[#002B49] text-white text-xs uppercase tracking-wider font-semibold px-5 py-2.5 rounded shadow hover:bg-blue-900 flex items-center">
      <i class="fas fa-user-graduate mr-2 text-yellow-400"></i> Apply Now
    </a>
  </nav>

  <!-- 3. HERO SECTION -->
  <section class="relative bg-gradient-to-r from-blue-50 via-white to-gray-100 py-16 px-6 md:px-16 flex flex-col md:flex-row items-center justify-between">
    <div class="md:w-1/2 space-y-4 mb-8 md:mb-0">
      <span class="text-xs font-bold uppercase tracking-widest text-yellow-600">WELCOME TO</span>
      <h1 class="text-4xl md:text-5xl font-black text-[#002B49]">
        NOBLE <span class="text-yellow-600">ACADEMY</span>
      </h1>
      <p class="text-gray-600 text-sm max-w-md leading-relaxed">
        Noble Academy is committed to providing quality education, building character, and shaping the leaders of tomorrow. Join us and be part of a brighter future.
      </p>
      <div class="flex space-x-4 pt-2">
        <a href="#" class="bg-[#002B49] text-white text-xs uppercase tracking-wider px-6 py-3 rounded font-semibold shadow hover:bg-blue-900">
          <i class="fas fa-edit mr-2"></i> Apply Online
        </a>
        <a href="#" class="border border-[#002B49] text-[#002B49] text-xs uppercase tracking-wider px-6 py-3 rounded font-semibold hover:bg-blue-50 flex items-center">
          Learn More <i class="fas fa-arrow-right ml-2"></i>
        </a>
      </div>
    </div>

    <!-- Hero Image Placeholder / Banner -->
    <div class="md:w-1/2 flex justify-center">
      <div class="relative w-full max-w-lg h-72 md:h-80 bg-gray-300 rounded-lg overflow-hidden shadow-lg border-4 border-white">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80" alt="Students" class="w-full h-full object-cover">
      </div>
    </div>
  </section>

  <!-- 4. FEATURE CARDS SECTION -->
  <section class="max-w-7xl mx-auto px-6 -mt-8 relative z-10 grid grid-cols-1 md:grid-cols-5 gap-4">
    <!-- Card 1 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-100 flex items-center space-x-3 hover:shadow-lg transition">
      <div class="bg-blue-50 p-3 rounded-full text-blue-800 text-xl"><i class="fas fa-graduation-cap"></i></div>
      <div>
        <h3 class="font-bold text-xs uppercase text-[#002B49]">Quality Education</h3>
        <p class="text-[10px] text-gray-500">We offer high quality education from experienced teachers.</p>
      </div>
    </div>
    <!-- Card 2 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-100 flex items-center space-x-3 hover:shadow-lg transition">
      <div class="bg-yellow-50 p-3 rounded-full text-yellow-600 text-xl"><i class="fas fa-user-plus"></i></div>
      <div>
        <h3 class="font-bold text-xs uppercase text-[#002B49]">Online Admission</h3>
        <p class="text-[10px] text-gray-500">Apply online easily and get quick response.</p>
      </div>
    </div>
    <!-- Card 3 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-100 flex items-center space-x-3 hover:shadow-lg transition">
      <div class="bg-blue-50 p-3 rounded-full text-blue-800 text-xl"><i class="fas fa-id-card"></i></div>
      <div>
        <h3 class="font-bold text-xs uppercase text-[#002B49]">Student ID</h3>
        <p class="text-[10px] text-gray-500">Automatic Student ID is generated after approval.</p>
      </div>
    </div>
    <!-- Card 4 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-100 flex items-center space-x-3 hover:shadow-lg transition">
      <div class="bg-yellow-50 p-3 rounded-full text-yellow-600 text-xl"><i class="fas fa-desktop"></i></div>
      <div>
        <h3 class="font-bold text-xs uppercase text-[#002B49]">Student Portal</h3>
        <p class="text-[10px] text-gray-500">Students can check results, fees and important notices.</p>
      </div>
    </div>
    <!-- Card 5 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-100 flex items-center space-x-3 hover:shadow-lg transition">
      <div class="bg-blue-50 p-3 rounded-full text-blue-800 text-xl"><i class="fas fa-building"></i></div>
      <div>
        <h3 class="font-bold text-xs uppercase text-[#002B49]">Modern Facilities</h3>
        <p class="text-[10px] text-gray-500">Libraries, Labs, Computer Rooms and more.</p>
      </div>
    </div>
  </section>

  <!-- 5. ABOUT US SECTION -->
  <section class="max-w-7xl mx-auto py-16 px-6 grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
    <!-- Building Image -->
    <div class="rounded-lg overflow-hidden shadow-lg border-2 border-gray-200">
      <img src="https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=800&q=80" alt="School Building" class="w-full h-72 object-cover">
    </div>

    <!-- About Content -->
    <div class="space-y-4">
      <span class="text-xs font-bold uppercase tracking-widest text-yellow-600">ABOUT US</span>
      <h2 class="text-2xl md:text-3xl font-bold text-[#002B49]">
        Welcome to <span class="text-yellow-600">Noble Academy</span>
      </h2>
      <p class="text-gray-600 text-xs leading-relaxed">
        Noble Academy is a leading educational institution in Jijiga dedicated to academic excellence and moral integrity. We provide a supportive and challenging environment that empowers students to reach their full potential.
      </p>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-4">
        <div class="flex items-center space-x-2">
          <i class="fas fa-users text-blue-900 text-xl"></i>
          <div>
            <h4 class="font-bold text-sm text-[#002B49]">1500+</h4>
            <p class="text-[10px] text-gray-500">Students</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <i class="fas fa-chalkboard-teacher text-blue-900 text-xl"></i>
          <div>
            <h4 class="font-bold text-sm text-[#002B49]">60+</h4>
            <p class="text-[10px] text-gray-500">Teachers</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <i class="fas fa-book text-blue-900 text-xl"></i>
          <div>
            <h4 class="font-bold text-sm text-[#002B49]">25+</h4>
            <p class="text-[10px] text-gray-500">Subjects</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <i class="fas fa-trophy text-yellow-600 text-xl"></i>
          <div>
            <h4 class="font-bold text-sm text-[#002B49]">10+</h4>
            <p class="text-[10px] text-gray-500">Awards</p>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
 workflow uses actions that are not certified by GitHub.
